name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
      - name: Install docker CLI (act only)
        if: ${{ env.ACT }}
        run: |
          apt-get update && apt-get install -y docker.io
      - run: docker build -t ${{ github.repository }}:${{ github.sha }} .
